services:
  - type: web
    name: my-journal-be
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node server.js
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: GITHUB_DISPATCH_TOKEN
        sync: false
      - key: NODE_ENV
        value: production
